name: Build Deepin Music for CachyOS

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "config.h.in"
      - ".github/workflows/build-cachyos.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git cmake ninja pkgconf \
            qt6-base qt6-svg qt6-multimedia-ffmpeg \
            qt6-tools qt6-declarative qt6-5compat \
            dtk6core qt6mpris dtk6gui dtk6declarative \
            ffmpeg icu taglib libxtst vlc sdl2 \
            gstreamer gst-plugins-base gst-plugins-good \
            gst-plugins-bad gst-plugins-ugly \
            gst-libav

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required packages
        run: |
          pacman -Q \
            cmake qt6-base dtk6core dtk6gui \
            dtk6declarative qt6mpris ffmpeg taglib vlc

      - name: Configure
        run: |
          cmake -S . -B Build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          cmake --build Build --parallel "$(nproc)"

      - name: Create PKGBUILD
        run: |
          cat > PKGBUILD <<'EOF'
          pkgname=deepin-music-git
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="Deepin Music player"
          arch=('x86_64')
          url="https://github.com/linuxdeepin/deepin-music"
          license=('GPL-3.0-or-later')

          depends=(
            qt6-base qt6-svg qt6-multimedia
            qt6-declarative qt6-5compat
            dtk6core dtk6gui dtk6declarative
            qt6mpris ffmpeg icu taglib libxtst vlc sdl2
            gstreamer gst-plugins-base gst-plugins-good
            gst-plugins-bad gst-plugins-ugly gst-libav
          )

          makedepends=(cmake ninja pkgconf)

          package() {
            DESTDIR="$pkgdir" cmake --install "$startdir/Build"
          }
          EOF

      - name: Build Arch package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c \
            'cd "$GITHUB_WORKSPACE" && makepkg --nodeps --noconfirm'

      - name: Verify package
        run: |
          PACKAGE="$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
          test -n "$PACKAGE"
          pacman -Qip "$PACKAGE"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepin-music-cachyos-${{ github.sha }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 14
