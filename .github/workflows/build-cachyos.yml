```yaml
name: Build Deepin Music for CachyOS

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "config.h.in"
      - ".github/workflows/build-cachyos.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git cmake ninja pkgconf \
            qt6-base qt6-svg qt6-multimedia \
            qt6-tools qt6-declarative qt6-5compat \
            dtk6core dtk6gui dtk6declarative \
            ffmpeg icu taglib libxtst vlc sdl2 \
            gstreamer gst-plugins-base gst-plugins-good \
            gst-plugins-bad gst-plugins-ugly \
            gst-libav

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required packages
        run: |
          pacman -Q \
            cmake qt6-base dtk6core dtk6gui \
            dtk6declarative ffmpeg taglib vlc

      - name: Configure
        run: |
          cmake -S . -B Build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          cmake --build Build --parallel "$(nproc)"

      - name: Package application
        run: |
          DESTDIR="$PWD/AppDir" cmake --install Build
          test -d AppDir/usr
          tar -C AppDir -czf deepin-music-cachyos.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepin-music-cachyos-${{ github.sha }}
          path: deepin-music-cachyos.tar.gz
          if-no-files-found: error
          retention-days: 14
